<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>免状・手帳・健診 記入</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  .tp { border: 1.5px solid #e5e7eb; border-radius: 12px; padding: 4px 12px; margin-bottom: 10px; }
  .tp.on { border-color: #0c447c; background: #f5f9fd; }
  .chk { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 16px; font-weight: 700; }
  .chk input { width: 22px; height: 22px; }
  .dates { padding-bottom: 4px; }
  .cert { display: block; }
  .cert .row1 { display: flex; justify-content: space-between; align-items: center; }
  .cert .nt { font-size: 12px; color: #6b7280; margin-top: 6px; }
  .cert.alert .nt { color: #a32d2d; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">‹ 総合ページへ</a>
  <div class="title">免状・手帳・健診 記入</div>
  <div class="subtitle">早駒運輸 播磨タグ</div>

  <div class="label">名前</div>
  <select id="name"><option value="">読み込み中…</option></select>

  <div id="main" style="display:none;">
    <div class="label">次回期限</div>
    <div id="certs"></div>

    <div class="label">更新したら記入（いくつでも選べます）</div>
    <div class="box">
      <div id="types"></div>
      <label class="field"><span>備考（なくてもOK）</span><input type="text" id="memo" maxlength="200" placeholder="例）3級　更新講習受講"></label>
      <button class="btn" id="sendBtn" onclick="sendRecord()">送信</button>
      <div class="msg" id="recMsg"></div>
    </div>

    <div class="label">通知メールの宛先</div>
    <div class="box">
      <div id="curMail" style="font-size:14px;margin-bottom:8px;"></div>
      <div style="display:flex;gap:8px;">
        <input type="email" id="mail" placeholder="例）yamada@example.com" autocomplete="email">
        <button class="btn sub" id="mailBtn" onclick="saveMail()">登録</button>
      </div>
      <div class="msg" id="mailMsg"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  var sel = document.getElementById('name');

  apiGet({ action: 'names' }).then(function (res) {
    sel.innerHTML = '<option value="">名前を選んでください</option>' +
      res.names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
    try { var last = localStorage.getItem('certName'); if (last && res.names.indexOf(last) >= 0) { sel.value = last; loadMine(); } } catch (e) {}
  }).catch(function (err) {
    sel.innerHTML = '<option value="">読み込めませんでした</option>';
  });

  sel.onchange = function () {
    try { localStorage.setItem('certName', sel.value); } catch (e) {}
    TYPES = [];   // 名前を変えたら記入欄を作り直す
    loadMine();
  };

  function loadMine() {
    var name = sel.value;
    if (!name) { document.getElementById('main').style.display = 'none'; return; }
    document.getElementById('main').style.display = 'block';
    document.getElementById('certs').innerHTML = '<div class="note">読み込み中…</div>';
    apiGet({ action: 'mine', name: name }).then(function (res) {
      var m = res.mine;
      // 種類の頭ごとに、記入済みのものだけ出す。どれも無ければ頭の名前で1つだけ
      var show = [];
      ['海技免状', '船員手帳', '健康診断'].forEach(function (b) {
        var g = m.certs.filter(function (c) { return c.type.indexOf(b) === 0; });
        var has = g.filter(function (c) { return c.next; });
        show = show.concat(has.length ? has : [{ type: b, next: '' }]);
      });
      document.getElementById('certs').innerHTML = show.map(function (c) {
        if (!c.next) return '<div class="cert none"><div class="row1"><span class="n">' + esc(c.type) + '</span><span class="v"><small>まだ記入されていません</small></span></div></div>';
        var d = daysLeft(c.next);
        var sub = d < 0 ? '期限切れ　早めに更新を' : 'あと' + d + '日' + (c.alert ? '　早めに更新を' : '');
        var cls = (c.alert || d < 0) ? 'cert alert' : 'cert';
        return '<div class="' + cls + '"><div class="row1"><span class="n">' + esc(c.type) + '</span><span class="v"><b>' + slashDate(c.next) + '</b><small>' + sub + '</small></span></div>' +
          (c.note ? '<div class="nt">備考：' + esc(c.note) + '</div>' : '') + '</div>';
      }).join('');
      buildTypes(m.types);
      document.getElementById('curMail').innerHTML = m.email
        ? '今の宛先：<b>' + esc(m.email) + '</b>（変えるときは下に入れて「登録」）'
        : '<span style="color:#b91c1c;font-weight:700;">まだ登録されていません。</span>登録すると期限が近づいたときにメールが届きます。';
    }).catch(function (err) {
      document.getElementById('certs').innerHTML = '<div class="note">読み込めませんでした（' + esc(err.message) + '）</div>';
    });
  }

  function showMsg(id, ok, text) {
    var el = document.getElementById(id);
    el.className = 'msg ' + (ok ? 'ok' : 'ng');
    el.textContent = text;
  }

  // ---- 種類のチェックと日付欄（名前ごとに作り直す） ----
  var TYPES = [];
  var YEARS = { '海技免状': 5, '船員手帳': 10, '健康診断': 1 };
  var autoNext = {};

  function buildTypes(types) {
    if (TYPES.join() === types.join()) return;   // 同じなら作り直さない（入力中の内容を消さない）
    TYPES = types;
    autoNext = {};
    document.getElementById('types').innerHTML = TYPES.map(function (t, i) {
      return '<div class="tp" id="tp' + i + '">' +
        '<label class="chk"><input type="checkbox" id="ck' + i + '" onchange="toggleType(' + i + ')"><span>' + esc(t) + '</span></label>' +
        '<div class="dates" id="dt' + i + '" style="display:none;">' +
          '<label class="field"><span>受けた日／取得日</span><input type="date" id="tk' + i + '" onchange="autoFill(' + i + ')"></label>' +
          '<label class="field"><span>次回期限（自動で入ります。違えば直してください）</span><input type="date" id="nx' + i + '"></label>' +
        '</div></div>';
    }).join('');
  }

  // 受けた日 → 次回期限（○年後の前日）
  function autoFill(i) {
    var tk = document.getElementById('tk' + i).value;
    var nx = document.getElementById('nx' + i);
    if (!tk) return;
    if (nx.value && nx.value !== autoNext[i]) return;   // 手で入れた期限は上書きしない
    var base = TYPES[i].replace(/（.*）$/, '');
    var p = tk.split('-').map(Number);
    var d = new Date(p[0] + (YEARS[base] || 1), p[1] - 1, p[2]);
    d.setDate(d.getDate() - 1);
    var v = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    nx.value = v;
    autoNext[i] = v;
  }

  function toggleType(i) {
    var on = document.getElementById('ck' + i).checked;
    document.getElementById('dt' + i).style.display = on ? 'block' : 'none';
    document.getElementById('tp' + i).classList.toggle('on', on);
  }

  function sendRecord() {
    var items = [];
    for (var i = 0; i < TYPES.length; i++) {
      if (!document.getElementById('ck' + i).checked) continue;
      var taken = document.getElementById('tk' + i).value;
      var next = document.getElementById('nx' + i).value;
      if (!next) return showMsg('recMsg', false, TYPES[i] + 'の次回期限を入れてください');
      if (taken && taken > next) return showMsg('recMsg', false, TYPES[i] + '：受けた日が次回期限より後になっています');
      items.push({ type: TYPES[i], taken: taken, next: next });
    }
    if (!items.length) return showMsg('recMsg', false, '更新した種類にチェックを入れてください');
    var note = document.getElementById('memo').value;
    var btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = '送信中…';
    var done = [];
    // 1件ずつ順番に送る
    items.reduce(function (p, it) {
      return p.then(function () {
        return apiPost({ action: 'record', name: sel.value, type: it.type, taken: it.taken, next: it.next, note: note })
          .then(function () { done.push(it.type); });
      });
    }, Promise.resolve()).then(function () {
      showMsg('recMsg', true, '✓ 送信しました（' + done.join('・') + '）');
      for (var i = 0; i < TYPES.length; i++) {
        document.getElementById('ck' + i).checked = false;
        document.getElementById('tk' + i).value = '';
        document.getElementById('nx' + i).value = '';
        toggleType(i);
        delete autoNext[i];
      }
      document.getElementById('memo').value = '';
      loadMine();
    }).catch(function (err) {
      var head = done.length ? done.join('・') + 'は送信済み。' : '';
      showMsg('recMsg', false, head + '送信できませんでした：' + err.message);
      loadMine();
    }).then(function () { btn.disabled = false; btn.textContent = '送信'; });
  }

  function saveMail() {
    var email = document.getElementById('mail').value.trim();
    if (!email) return showMsg('mailMsg', false, 'メールアドレスを入れてください');
    var btn = document.getElementById('mailBtn');
    btn.disabled = true;
    apiPost({ action: 'email', name: sel.value, email: email }).then(function () {
      showMsg('mailMsg', true, '✓ 登録しました');
      document.getElementById('mail').value = '';
      loadMine();
    }).catch(function (err) {
      showMsg('mailMsg', false, '登録できませんでした：' + err.message);
    }).then(function () { btn.disabled = false; });
  }
</script>
</body>
</html>
