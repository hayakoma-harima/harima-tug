<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>播磨タグ ポータル</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="播磨タグ">
<meta name="theme-color" content="#0c447c">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 12H2a10 10 0 0 0 20 0h-3M8 10h8"/></svg>
    </div>
    <div>
      <div class="title">播磨タグ ポータル</div>
      <div class="subtitle">早駒運輸 乗組員用</div>
    </div>
  </div>
  <div id="list"><div class="note">読み込み中…</div></div>
</div>

<script src="config.js"></script>
<script>
  var ICONS = {
    '確認': ['c-green',  '<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>'],
    '入力': ['c-purple', '<path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3"/><path d="M13.5 6.5l3 3"/>'],
    '閲覧': ['c-purple', '<path d="M3 19a9 9 0 0 1 9 0 9 9 0 0 1 9 0V6a9 9 0 0 0-9 0 9 9 0 0 0-9 0z"/><path d="M12 6v13"/>'],
    '記入': ['c-amber',  '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'],
    '一覧': ['c-amber',  '<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>'],
    '_':    ['c-blue',   '<path d="M10 14a3.5 3.5 0 0 0 5 0l4-4a3.5 3.5 0 0 0-5-5l-.5.5"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-4 4a3.5 3.5 0 0 0 5 5l.5-.5"/>']
  };

  function render(links) {
    if (!links.length) { document.getElementById('list').innerHTML = '<div class="note">表示するリンクがありません</div>'; return; }
    var groups = [], byGroup = {};
    links.forEach(function (l) {
      if (!byGroup[l.group]) { byGroup[l.group] = []; groups.push(l.group); }
      byGroup[l.group].push(l);
    });
    var html = '';
    groups.forEach(function (g) {
      html += '<div class="label">' + esc(g) + '</div>';
      byGroup[g].forEach(function (l) {
        var ic = ICONS[l.icon] || ICONS['_'];
        html += '<a class="card" href="' + esc(l.url) + '">' +
          '<div class="ic ' + ic[0] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ic[1] + '</svg></div>' +
          '<div><div class="t">' + esc(l.title) + '</div>' + (l.desc ? '<div class="d">' + esc(l.desc) + '</div>' : '') + '</div>' +
          '<div class="chev">›</div></a>';
      });
    });
    document.getElementById('list').innerHTML = html;
  }

  // 前回の一覧をすぐ出して、裏で最新に更新
  try { var cached = JSON.parse(localStorage.getItem('links') || 'null'); if (cached) render(cached); } catch (e) {}

  apiGet({ action: 'links' })
    .then(function (res) {
      render(res.links);
      try { localStorage.setItem('links', JSON.stringify(res.links)); } catch (e) {}
    })
    .catch(function (err) {
      if (!document.querySelector('.card')) {
        document.getElementById('list').innerHTML = '<div class="note">読み込めませんでした。電波を確認して、もう一度開いてください。<br>（' + esc(err.message) + '）</div>';
      }
    });
</script>
</body>
</html>
